[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moot"
version = "0.1.0"
description = "Adversarial multi-agent autopilot for Meta Ads accounts."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml",
    "requests",
    "click",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
moot = "moot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import order
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "BLE", # blind-except (the write layer's broad excepts carry noqa + reason)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "ARG", # unused arguments
    "PTH", # use pathlib
    "C4",  # comprehensions
    "RET", # return hygiene
    "TRY", # exception hygiene
]
# Optional[X] is the house style — matches the spec's vocabulary — so the
# PEP 604 rewrite rules are turned off rather than mixed.
# TRY003 (long messages inline in raise) is off deliberately: actionable
# error text is the product here — every ConfigError message names the fix.
# RUF001/002/003 (ambiguous unicode) are off: the em dash, § and × marks are
# the established voice of this codebase and its docs — the gates.md section
# citations they appear in must survive verbatim.
ignore = ["UP007", "UP035", "UP037", "UP045", "TRY003",
          "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# conftest pins THIS checkout's src/ ahead of any editable install, which
# must run before the moot imports — E402 is the price of that guarantee.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["moot"]

# PyYAML ships no inline types; types-PyYAML is a dev-only extra the runtime
# should not require. Narrow override rather than a global ignore.
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # tests/e2e applies this to everything it collects; `-m "not e2e"` runs
    # the fast unit suite alone.
    "e2e: end-to-end plugin-layer tests — hooks and CLI exercised as subprocesses",
]
